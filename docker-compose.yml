services:
  radar:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://radar:radar_dev_only@postgres:5432/radar
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: ["python", "-m", "app.main", "run"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - radar_pgdata:/var/lib/postgresql/data

volumes:
  radar_pgdata:
