[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-money-radar"
version = "0.1.0"
description = "Read-only multi-chain smart money wallet monitor"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=12,<16",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<14",
]

[project.scripts]
smr = "app.main:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
